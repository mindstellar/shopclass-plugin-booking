# Runs the unit tests and the database tests on every push and pull request, against
# core's develop branch.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SHOPCLASS_CORE: ${{ github.workspace }}/core
      DRIFT_DB_HOST: 127.0.0.1
      DRIFT_DB_PORT: 3306
      DRIFT_DB_USER: root
      DRIFT_DB_PASS: root
    steps:
      - uses: actions/checkout@v4

      - name: Check out core
        uses: actions/checkout@v4
        with:
          repository: mindstellar/shopclass
          ref: develop
          path: core

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl

      - name: Install core's PHP packages
        working-directory: core
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Unit tests
        run: ./tests/run.sh

      - name: Database tests
        run: php tests/integration/flow.php
